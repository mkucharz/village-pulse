version: "3"

tasks:
  build:
    desc: Build binary
    cmds:
      - templ generate
      - CGO_ENABLED=0 go build -ldflags="-s -w" -o village-pulse ./cmd/village-pulse

  dev:
    desc: Dev mode (hot reload)
    cmds:
      - go run ./cmd/village-pulse

  generate:
    desc: Generate Templ code
    cmds:
      - templ generate

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test -race -count=1 ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f village-pulse
      - rm -rf data/
